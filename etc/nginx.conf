# Note that no environment variables are interpolated into this file.

user              nginx;
worker_processes  auto;
error_log         /var/log/nginx/error.log notice;
pid               /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include           /etc/nginx/mime.types;
    default_type      application/octet-stream;
    sendfile          on;
    keepalive_timeout 60;
    server_tokens     off;

    log_format main 'ProxyCrypt $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    include /etc/nginx/conf.d/*.conf;

    map $http_x_forwarded_host $upstream_host {
        default $http_x_forwarded_host;
        ""      $http_host;
    }

    map $http_x_forwarded_proto $upstream_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_x_forwarded_port $upstream_port {
        default $http_x_forwarded_port;
        ""      $server_port;
    }

}

